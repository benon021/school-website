<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mt. Elgon Academy Primary School | Kitale, Trans Nzoia County, Kenya</title>
    <meta
      name="description"
      content="Mt. Elgon Academy Primary School is located in Central Trans Nzoia, Kitale Town, Saboti Constituency, Trans Nzoia County, Kenya, offering the competency-based Kenyan curriculum in a values-driven environment."
    />
    <meta name="theme-color" content="#0b1f4d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div id="app-initial-loader" style="position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;">
        <div style="position:relative;width:68px;height:76px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#dc2626,#991b1b);clip-path:polygon(50% 0%,100% 15%,100% 65%,50% 100%,0% 65%,0% 15%);box-shadow:0 10px 25px rgba(220,38,38,0.4);animation:loaderPulse 1.6s ease-in-out infinite;">
          <span style="font-size:22px;font-weight:900;letter-spacing:1px;color:#ffffff;">MEA</span>
        </div>
        <div style="margin-top:22px;text-align:center;">
          <h2 style="margin:0;font-size:18px;font-weight:700;letter-spacing:0.5px;color:#f8fafc;">Mt. Elgon Academy</h2>
          <p style="margin:4px 0 0;font-size:12px;color:#94a3b8;letter-spacing:0.3px;">Primary School • Kitale</p>
        </div>
        <div style="margin-top:24px;width:140px;height:3px;background:rgba(255,255,255,0.15);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,#dc2626,#ef4444);border-radius:99px;animation:loaderProgress 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes loaderPulse {
          0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(220,38,38,0.3)); }
          50% { transform: scale(1.06); filter: drop-shadow(0 0 20px rgba(220,38,38,0.6)); }
        }
        @keyframes loaderProgress {
          0% { left: -40%; width: 30%; }
          50% { width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
